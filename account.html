<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0F172A">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/icon-192.svg">
  <script src="/pwa.js" defer></script>
  <title>Account — Tranzlet</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{navy:'#172033',orange:'#F97316'}}}}</script>
</head>
<body class="min-h-screen bg-slate-50 text-navy antialiased">
<header class="sticky top-0 z-30 border-b border-slate-200 bg-white/95 backdrop-blur">
  <div class="max-w-3xl mx-auto px-5 sm:px-8 h-16 flex items-center justify-between">
    <a href="./dashboard.html" class="text-2xl font-bold tracking-tight">tranzlet<span class="text-orange">.</span></a>
    <button id="sign-out-btn" class="rounded-lg border border-slate-300 px-3 py-2 text-sm font-semibold hover:bg-slate-50">Sign out</button>
  </div>
</header>
<main class="max-w-3xl mx-auto px-5 sm:px-8 py-8 pb-16">
  <div class="mb-7">
    <p class="text-orange text-xs font-bold uppercase tracking-[.16em]">Account</p>
    <h1 class="mt-2 text-3xl font-semibold tracking-tight">Account settings</h1>
    <p class="mt-2 text-slate-500">Manage your profile and account details.</p>
  </div>

  <section class="rounded-2xl bg-white border border-slate-200 p-6 sm:p-7">
    <h2 class="text-xl font-semibold">Profile</h2>
    <form id="profile-form" class="mt-6 space-y-5">
      <div>
        <label for="full-name" class="block text-xs font-semibold uppercase tracking-wide text-slate-500">Full name</label>
        <input id="full-name" required maxlength="120" autocomplete="name" class="mt-1.5 w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm outline-none focus:border-orange focus:ring-2 focus:ring-orange/20">
      </div>
      <div>
        <label for="phone-number" class="block text-xs font-semibold uppercase tracking-wide text-slate-500">Phone number</label>
        <input id="phone-number" required maxlength="30" autocomplete="tel" class="mt-1.5 w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm outline-none focus:border-orange focus:ring-2 focus:ring-orange/20">
      </div>
      <div>
        <label for="email-address" class="block text-xs font-semibold uppercase tracking-wide text-slate-500">Email address</label>
        <input id="email-address" type="email" readonly class="mt-1.5 w-full rounded-lg border border-slate-200 bg-slate-50 px-3 py-2.5 text-sm text-slate-500">
        <p class="mt-1.5 text-xs text-slate-400">Your sign-in email is managed by your authentication account.</p>
      </div>
      <div class="flex justify-end">
        <button id="save-profile-btn" type="submit" class="rounded-lg bg-orange px-5 py-2.5 text-sm font-semibold text-white hover:bg-orange-600">Save changes</button>
      </div>
      <p id="profile-message" class="text-sm" aria-live="polite"></p>
    </form>
  </section>

  <section class="mt-5 rounded-2xl bg-white border border-slate-200 p-6 sm:p-7">
    <h2 class="text-xl font-semibold">Security</h2>
    <div class="mt-5 flex items-center justify-between gap-5 rounded-xl border border-slate-200 p-4">
      <div><p class="text-sm font-semibold">Password</p><p class="mt-1 text-xs text-slate-500">Change your sign-in password from your secure account.</p></div>
      <button id="change-password-btn" type="button" class="shrink-0 rounded-lg border border-slate-300 px-4 py-2.5 text-sm font-semibold hover:bg-slate-50">Change</button>
    </div>
    <p id="security-message" class="mt-3 text-sm" aria-live="polite"></p>
  </section>

  <section class="mt-5 rounded-2xl border border-red-100 bg-white p-6 sm:p-7">
    <h2 class="text-xl font-semibold text-slate-900">Sign out</h2>
    <p class="mt-1 text-sm text-slate-500">End your current Tranzlet session on this device.</p>
    <button id="sign-out-secondary" type="button" class="mt-5 rounded-lg border border-slate-300 px-4 py-2.5 text-sm font-semibold hover:bg-slate-50">Sign out</button>
  </section>
</main>
<script src="./env.js"></script>
<script type="module" src="./supabase/account.js"></script>
</body>
</html>
