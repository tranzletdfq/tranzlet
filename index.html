<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tranzlet — Secure Manual Remittance PWA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slateNavy: '#1E293B',
                        vibrantOrange: '#F97316'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slateNavy min-h-screen flex flex-col justify-between font-sans">

    <header class="bg-slateNavy text-white py-4 px-6 shadow-md flex justify-between items-center">
        <div class="text-xl font-bold tracking-wide flex items-center gap-2">
            <span class="text-vibrantOrange">⚡</span> Tranzlet
        </div>
        <div id="auth-status-container" class="text-sm font-medium text-slate-300">
            Secure Portal
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center p-4">
        <div class="max-w-md w-full bg-white rounded-xl shadow-lg border border-slate-200 p-8">
            <div id="login-view">
                <h2 class="text-2xl font-bold text-slateNavy mb-2">Welcome Back</h2>
                <p class="text-sm text-slate-500 mb-6">Sign in to manage your remittance tags and wallet.</p>

                <form id="login-form" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Email Address</label>
                        <input type="email" id="email-input" required class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-vibrantOrange text-sm" placeholder="name@example.com">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Password</label>
                        <input type="password" id="password-input" required class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-vibrantOrange text-sm" placeholder="••••••••">
                    </div>
                    <button type="submit" class="w-full bg-vibrantOrange hover:bg-orange-600 text-white font-semibold py-2.5 rounded-lg transition duration-200 shadow-sm text-sm">
                        Sign In to Dashboard
                    </button>
                </form>
            </div>

            <div id="dashboard-view" class="hidden space-y-6">
                <div class="bg-slate-50 p-4 rounded-lg border border-slate-200">
                    <p class="text-xs uppercase text-slate-500 font-semibold">Available NGN Balance</p>
                    <p id="wallet-balance-display" class="text-3xl font-extrabold text-slateNavy mt-1">₦0.00</p>
                </div>
                <div>
                    <h3 class="text-lg font-bold text-slateNavy mb-2">Remittance Ledger</h3>
                    <div id="tags-ledger-container" class="space-y-2 text-sm text-slate-600">
                        <p class="text-slate-400 italic">No active tags found.</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="text-center py-4 text-xs text-slate-400 border-t border-slate-200">
        &copy; 2026 Tranzlet. All rights reserved. Secured Remittance Platform.
    </footer>

    <script type="module" src="./supabase/app.js"></script>
</body>
</html>
